<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Page Brightness</title>
<style>
  /* Colors are tokens on :root. Light and dark values are kept as raw custom properties,
     chosen first by prefers-color-scheme and then by light-dark() where supported. */
  :root {
    --text-light: #222;       --text-dark: #eee;
    --muted-light: #666;      --muted-dark: #aaa;
    --bg-light: #fff;         --bg-dark: #222;
    --border-light: #ccc;     --border-dark: #555;
    --button-light: #f6f6f6;  --button-dark: #333;
    --hover-light: #eaeaea;   --hover-dark: #444;
    --rule-light: #ddd;       --rule-dark: #444;
    --night-light: #5b45c9;   --night-dark: #a99bff;
    --accent-light: #2f6fed;  --accent-dark: #6d9bff;

    --text: var(--text-light);     --muted: var(--muted-light);
    --bg: var(--bg-light);         --border: var(--border-light);
    --button: var(--button-light); --hover: var(--hover-light);
    --rule: var(--rule-light);     --night: var(--night-light);
    --accent: var(--accent-light);

    color-scheme: light dark;
    accent-color: var(--accent);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: var(--text-dark);     --muted: var(--muted-dark);
      --bg: var(--bg-dark);         --border: var(--border-dark);
      --button: var(--button-dark); --hover: var(--hover-dark);
      --rule: var(--rule-dark);     --night: var(--night-dark);
      --accent: var(--accent-dark);
    }
  }
  @supports (color: light-dark(white, black)) {
    :root {
      --text: light-dark(var(--text-light), var(--text-dark));
      --muted: light-dark(var(--muted-light), var(--muted-dark));
      --bg: light-dark(var(--bg-light), var(--bg-dark));
      --border: light-dark(var(--border-light), var(--border-dark));
      --button: light-dark(var(--button-light), var(--button-dark));
      --hover: light-dark(var(--hover-light), var(--hover-dark));
      --rule: light-dark(var(--rule-light), var(--rule-dark));
      --night: light-dark(var(--night-light), var(--night-dark));
      --accent: light-dark(var(--accent-light), var(--accent-dark));
    }
  }

  body { font: 14px system-ui, sans-serif; width: 290px; margin: 0; padding: 14px; background: var(--bg); color: var(--text); }
  h1 { font-size: 15px; margin: 0 0 4px; }
  #host { color: var(--muted); font-size: 12px; margin-bottom: 12px; word-break: break-all; }
  #status { color: var(--night); font-size: 12px; margin: -6px 0 10px; }
  #status:empty { margin: 0; }
  .lbl { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 2px; }
  .row { display: flex; align-items: center; gap: 10px; }
  input[type=range] { flex: 1; min-width: 0; }
  .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  label.chk { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; min-block-size: 24px; }
  .btns { display: flex; gap: 6px; margin-top: 12px; }
  button { flex: 1; padding: 6px; border: 1px solid var(--border); background: var(--button); border-radius: 6px; cursor: pointer; color: inherit; font: inherit; }
  button:hover { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }
  :where(button, summary, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  details { margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 8px; font-size: 13px; }
  summary { cursor: pointer; user-select: none; }
  .times { margin-top: 8px; gap: 8px; }
  .times label { display: flex; align-items: center; gap: 4px; flex: 1; font-size: 12px; }
  .times input { flex: 1; min-width: 0; }
  .hint { font-size: 11px; color: var(--muted); margin: 8px 0 0; }
  .hint.tight { margin-top: 4px; }
  #siteList { list-style: none; margin: 8px 0 0; padding: 0; max-height: 140px; overflow-y: auto; }
  #siteList li { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  #siteList .name { flex: 1; min-width: 0; word-break: break-all; }
  #siteList .info { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #siteList .empty { color: var(--muted); font-size: 12px; }
  button.x { flex: none; min-inline-size: 24px; min-block-size: 24px; padding: 0 4px 2px; line-height: 20px; }
  #clearAll { width: 100%; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Page Brightness</h1>
  <div id="host"></div>
  <div id="status" role="status"></div>

  <label class="lbl" for="slider">Brightness</label>
  <div class="row">
    <input type="range" id="slider" min="10" max="200" step="1" value="100">
    <span class="val" id="val">100%</span>
  </div>

  <label class="lbl" for="wslider">Warmth</label>
  <div class="row">
    <input type="range" id="wslider" min="0" max="100" step="1" value="0">
    <span class="val" id="wval">0%</span>
  </div>

  <label class="chk" for="all"><input type="checkbox" id="all" aria-describedby="allHint"> Default for all sites</label>
  <p class="hint tight" id="allHint">Applies to every site that has no setting of its own.</p>
  <div class="btns">
    <button id="dim">Dim 60%</button>
    <button id="reset">Reset</button>
    <button id="bright">Bright 130%</button>
  </div>

  <details id="night">
    <summary>Night schedule</summary>
    <label class="chk" for="nightOn"><input type="checkbox" id="nightOn" aria-describedby="nightHint"> Auto-dim at night</label>
    <div class="row times">
      <label for="nightStart">From <input type="time" id="nightStart" value="21:00"></label>
      <label for="nightEnd">To <input type="time" id="nightEnd" value="07:00"></label>
    </div>
    <label class="lbl" for="nightB">Night brightness</label>
    <div class="row">
      <input type="range" id="nightB" min="30" max="100" step="1" value="70">
      <span class="val" id="nightBVal">70%</span>
    </div>
    <label class="lbl" for="nightW">Night warmth</label>
    <div class="row">
      <input type="range" id="nightW" min="0" max="100" step="1" value="30">
      <span class="val" id="nightWVal">30%</span>
    </div>
    <p class="hint" id="nightHint">Applies to every site, on top of each page's own setting.</p>
  </details>

  <details id="sites">
    <summary id="sitesSummary">Saved sites</summary>
    <ul id="siteList"></ul>
    <button id="clearAll">Clear all site settings</button>
  </details>
</main>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
